<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI IQ — Artificial Intelligence Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --ink:#f1f5f9; --muted:#94a3b8; --a:#22d3ee; --b:#a78bfa; --ok:#22c55e; --bad:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:Outfit,sans-serif; color:var(--ink); background:radial-gradient(800px 500px at 10% 0%,#1e3a5f,transparent),radial-gradient(700px 500px at 100% 100%,#3b1e5f,transparent),var(--bg); display:flex; flex-direction:column; align-items:center; padding:24px 16px; }
  .box { width:100%; max-width:680px; }
  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .logo { font-weight:800; font-size:24px; background:linear-gradient(90deg,var(--a),var(--b)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .timer { font-weight:700; font-size:18px; background:var(--card); padding:6px 14px; border-radius:999px; }
  .timer.hot { color:var(--bad); }
  .card { background:rgba(30,41,59,.85); border:1px solid #334155; border-radius:22px; padding:26px; box-shadow:0 30px 60px -20px rgba(0,0,0,.6); }
  .prog { height:8px; background:#334155; border-radius:8px; overflow:hidden; margin-bottom:18px; }
  .prog i { display:block; height:100%; background:linear-gradient(90deg,var(--a),var(--b)); transition:width .4s; }
  .qn { color:var(--muted); font-size:14px; }
  h2 { margin:6px 0 18px; font-size:clamp(20px,3vw,26px); line-height:1.3; }
  .opt { display:block; width:100%; text-align:left; background:#0f172a; border:2px solid #334155; color:var(--ink); border-radius:14px; padding:14px 16px; margin-bottom:10px; font:500 16px Outfit; cursor:pointer; transition:all .15s; }
  .opt:hover:not(:disabled) { border-color:var(--a); transform:translateX(3px); }
  .opt.right { border-color:var(--ok); background:rgba(34,197,94,.12); }
  .opt.wrong { border-color:var(--bad); background:rgba(239,68,68,.12); }
  .opt b { display:inline-grid; place-items:center; width:26px; height:26px; border-radius:8px; background:#334155; margin-right:10px; font-size:13px; }
  .fb { min-height:24px; margin:4px 0 12px; font-weight:500; }
  .next, .start { background:linear-gradient(90deg,var(--a),var(--b)); color:#0f172a; border:0; border-radius:12px; padding:13px 22px; font:700 16px Outfit; cursor:pointer; }
  .next:disabled { opacity:.4; cursor:not-allowed; }
  .hero { text-align:center; }
  .hero h1 { font-size:clamp(32px,5vw,48px); margin:10px 0; }
  .hero p { color:var(--muted); font-size:17px; }
  .chips { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:18px 0 24px; }
  .chips span { background:#0f172a; border:1px solid #334155; border-radius:999px; padding:6px 12px; font-size:14px; }
  .score { font-size:72px; font-weight:800; background:linear-gradient(90deg,var(--a),var(--b)); -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1; }
  .review { text-align:left; margin-top:18px; max-height:260px; overflow:auto; }
  .review div { padding:8px 0; border-bottom:1px dashed #334155; font-size:14px; }
  .best { color:var(--muted); margin-top:8px; }
  footer { color:var(--muted); font-size:13px; margin-top:20px; }
</style>
</head>
<body>
<div class="box">
  <div class="head"><div class="logo">🧠 AI IQ</div><div class="timer" id="timer">⏱ 20s</div></div>
  <div class="card" id="card"></div>
</div>
<footer>Built live by AI · InEra School of Intelligence</footer>

<script>
const Q = [
  {q:'What does "LLM" stand for?', o:['Large Language Model','Linear Learning Machine','Logical Language Module','Long Loop Memory'], a:0, e:'LLMs like Gemini, Claude and GPT are Large Language Models trained on huge amounts of text.'},
  {q:'What is a "prompt" in generative AI?', o:['A type of GPU','The instruction or input you give the AI','A Python library','An error message'], a:1, e:'A prompt is the instruction you give. Better prompts → better outputs.'},
  {q:'An "AI agent" is different from a chatbot because it…', o:['Only answers questions','Can plan and take actions using tools','Never uses the internet','Works only offline'], a:1, e:'Agents plan multi-step tasks and act — e.g. create a GitHub repo and deploy it.'},
  {q:'Which of these is used to automate workflows visually?', o:['n8n','Excel macros only','Photoshop','VLC'], a:0, e:'n8n connects apps and AI into automated workflows with a visual editor.'},
  {q:'What is "hallucination" in AI?', o:['AI running too fast','AI confidently giving wrong or made-up information','A GPU overheating','A training dataset'], a:1, e:'Always verify AI outputs — models can sound confident and still be wrong.'},
  {q:'Which platform hosts code and tracks versions?', o:['Vercel','GitHub','Canva','Zoom'], a:1, e:'GitHub stores code with full version history; Vercel deploys it to the web.'},
  {q:'What does Vercel do?', o:['Designs logos','Deploys websites to a live URL','Trains AI models','Sends emails'], a:1, e:'Vercel takes your code and gives it a live link on a global network.'},
  {q:'Machine Learning is best described as…', o:['Hard-coding every rule','Computers learning patterns from data','A kind of database','Only robotics'], a:1, e:'ML finds patterns in data instead of relying on hand-written rules.'}
];
const TIME = 20;
let i = 0, score = 0, t = TIME, timer = null, answers = [];
const $ = s => document.querySelector(s);
const best = () => +localStorage.getItem('aiiq_best') || 0;

function intro(){
  $('#card').innerHTML = `<div class="hero"><div style="font-size:54px">🤖</div><h1>How AI-ready are you?</h1>
    <p>${Q.length} questions · ${TIME} seconds each · instant feedback</p>
    <div class="chips"><span>LLMs</span><span>Prompting</span><span>Agents</span><span>Automation</span><span>Deployment</span></div>
    <button class="start" id="go">Start quiz →</button>${best()?`<div class="best">Your best: ${best()}/${Q.length}</div>`:''}</div>`;
  $('#go').onclick = () => { i=0; score=0; answers=[]; show(); };
  $('#timer').textContent = `⏱ ${TIME}s`;
}
function show(){
  const q = Q[i];
  $('#card').innerHTML = `<div class="prog"><i style="width:${i/Q.length*100}%"></i></div>
    <div class="qn">Question ${i+1} of ${Q.length} · Score ${score}</div><h2>${q.q}</h2>
    ${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><b>${'ABCD'[k]}</b>${o}</button>`).join('')}
    <div class="fb" id="fb"></div><button class="next" id="next" disabled>${i===Q.length-1?'See result':'Next →'}</button>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  $('#next').onclick = () => { i++; i<Q.length ? show() : result(); };
  t = TIME; tick(); clearInterval(timer); timer = setInterval(tick,1000);
}
function tick(){
  $('#timer').textContent = `⏱ ${t}s`; $('#timer').classList.toggle('hot', t<=5);
  if(t<=0){ pick(-1); return; } t--;
}
function pick(k){
  clearInterval(timer);
  const q = Q[i]; const ok = k===q.a;
  if(ok) score++;
  answers.push({q:q.q, ok, right:q.o[q.a]});
  document.querySelectorAll('.opt').forEach((b,n)=>{ b.disabled=true; if(n===q.a) b.classList.add('right'); else if(n===k) b.classList.add('wrong'); });
  $('#fb').innerHTML = (k===-1?'⏰ Time up! ':ok?'✅ Correct! ':'❌ Not quite. ') + `<span style="color:#94a3b8">${q.e}</span>`;
  $('#next').disabled = false;
}
function result(){
  clearInterval(timer);
  if(score>best()) localStorage.setItem('aiiq_best',score);
  const pct = Math.round(score/Q.length*100);
  const msg = pct>=80?'AI Pro 🚀 You are ready to build agents!':pct>=50?'Good start 👍 SOI will take you further.':'Beginner 🌱 Perfect time to start learning AI!';
  $('#card').innerHTML = `<div class="hero"><div class="qn">Your score</div><div class="score">${score}/${Q.length}</div><h2>${msg}</h2>
    <div class="review">${answers.map((a,n)=>`<div>${a.ok?'✅':'❌'} Q${n+1}. ${a.q}${a.ok?'':` <span style="color:#94a3b8">— ${a.right}</span>`}</div>`).join('')}</div>
    <br><button class="start" id="again">Try again ↺</button></div>`;
  $('#again').onclick = intro;
}
intro();
</script>
</body>
</html>
